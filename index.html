<!DOCTYPE html>
<html>
<body>
  <h2>Send Anonymous Message</h2>
  <form id="msgForm">
    <input type="text" name="name" placeholder="Your Name" required><br><br>
    <textarea name="message" placeholder="Secret Message" required></textarea><br><br>
    <button type="submit" id="submitBtn">Send to Sheet</button>
  </form>

  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2LpsxzDvZnwz7RcanzDcYIDSGqx225QcJSuZXuAcigk9mYuyAGyzVcN6LuSUk6PyJ/exec';
    const form = document.getElementById('msgForm');

    form.onsubmit = async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "Sending...";

      const data = {
        name: form.name.value,
        message: form.message.value
      };

      try {
        await fetch(scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify(data)
        });
        alert("Message sent successfully!");
        form.reset();
      } catch (error) {
        alert("Error sending message!");
      } finally {
        btn.disabled = false;
        btn.innerText = "Send to Sheet";
      }
    };
  </script>
</body>
</html>
