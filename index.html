<!DOCTYPE html>
<html>
<head>
    <style>
        body { 
            font-family: 'Courier New', monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: #050505; 
            color: #ff0000; 
            margin: 0; 
            overflow: hidden; 
        }
        
        .pfp-rain {
            position: fixed;
            top: -60px;
            width: 40px;
            height: 40px;
            background-image: url('https://i.ibb.co/B2PwTgdQ/20250910-013431.png');
            background-size: cover;
            border-radius: 50%;
            border: 3px solid #ff0000;
            box-shadow: 0 0 15px #ff0000, 0 0 30px rgba(255, 0, 0, 0.5);
            z-index: -1;
            opacity: 0.8;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            50% { box-shadow: 0 0 25px #ff0000, 0 0 50px #ff0000; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg) scale(0.8); opacity: 0; }
        }

        .profile-main { width: 120px; border-radius: 50%; border: 3px solid #ff0000; box-shadow: 0 0 25px #ff0000; margin-bottom: 20px; position: relative; z-index: 10; }
        
        form { 
            background: rgba(10, 10, 10, 0.95); 
            padding: 30px; 
            border-radius: 12px; 
            border: 2px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4); 
            width: 320px; 
            position: relative; 
            z-index: 10; 
            backdrop-filter: blur(8px); 
            overflow: hidden;
        }

        /* Thunderstorm Lightning Effect */
        #lightning-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .flash-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            opacity: 0;
            pointer-events: none;
            z-index: 19;
        }

        @keyframes lightning-flash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            20% { opacity: 0; }
            25% { opacity: 0.8; }
            30% { opacity: 0; }
            100% { opacity: 0; }
        }

        .trigger-flash {
            animation: lightning-flash 0.4s ease-out;
        }

        h3 { text-align: center; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 15px #ff0000; font-size: 15px; margin-top: 0; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #444; border-radius: 4px; color: #fff; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #ff0000; box-shadow: 0 0 15px #ff0000; }
        button { width: 100%; padding: 12px; background: #ff0000; color: #000; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-transform: uppercase; transition: 0.3s; }
        button:hover { background: #b30000; box-shadow: 0 0 25px #ff0000; color: #fff; }
    </style>
</head>
<body>
    <div id="rain-container"></div>
    <img src="https://i.ibb.co/B2PwTgdQ/20250910-013431.png" alt="Profile" class="profile-main">
    <form id="msgForm">
        <div id="flash-bg" class="flash-bg"></div>
        <canvas id="lightning-canvas"></canvas>
        <h3>FREEGUY doesn’t see your name</h3>
        <input name="name" id="nameInput" placeholder="ID / NAME" required>
        <textarea name="message" id="messageInput" placeholder="ENCRYPT MESSAGE..." rows="4" required></textarea>
        <button type="submit" id="submitBtn">Transmit Data</button>
    </form>

    <script>
        function createRain() {
            const container = document.getElementById('rain-container');
            for (let i = 0; i < 15; i++) {
                const drop = document.createElement('div');
                drop.className = 'pfp-rain';
                drop.style.left = Math.random() * 100 + 'vw';
                drop.style.animationDuration = (Math.random() * 4 + 8) + 's';
                drop.style.animationDelay = (Math.random() * 10) + 's';
                container.appendChild(drop);
            }
        }
        createRain();

        // Lightning Bolt Logic
        const canvas = document.getElementById('lightning-canvas');
        const ctx = canvas.getContext('2d');
        const flashBg = document.getElementById('flash-bg');

        function resizeCanvas() {
            const form = document.getElementById('msgForm');
            canvas.width = form.offsetWidth;
            canvas.height = form.offsetHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createLightning() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Trigger background flash
            flashBg.classList.remove('trigger-flash');
            void flashBg.offsetWidth;
            flashBg.classList.add('trigger-flash');

            // Draw lightning bolt
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'white';
            ctx.beginPath();

            let x = Math.random() * canvas.width;
            let y = 0;
            ctx.moveTo(x, y);

            // Create jagged segments
            const segments = 10;
            for (let i = 0; i < segments; i++) {
                x += (Math.random() - 0.5) * 60;
                y += canvas.height / segments;
                ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Clear the bolt after a short duration
            setTimeout(() => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }, 150);
        }

        // Initial delay then repeat every 5 seconds
        setTimeout(() => {
            createLightning();
            setInterval(createLightning, 5000);
        }, 1000);

        const URL = 'https://script.google.com/macros/s/AKfycbz2LpsxzDvZnwz7RcanzDcYIDSGqx225QcJSuZXuAcigk9mYuyAGyzVcN6LuSUk6PyJ/exec';
        document.getElementById('msgForm').onsubmit = function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = 'TRANSMITTING...';
            btn.disabled = true;
            fetch(URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    'name': document.getElementById('nameInput').value,
                    'message': document.getElementById('messageInput').value
                })
            })
            .then(() => {
                alert("Upload Complete.");
                document.getElementById('msgForm').reset();
            })
            .catch(err => alert("System Failure: " + err.message))
            .finally(() => {
                btn.innerText = 'Transmit Data';
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
