<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a Message</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: url('https://effective-gold-2f6nrnwang.edgeone.app/20251231_212639.png') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    background: rgba(255,255,255,0.9);
    padding: 25px 30px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    width: 100%;
    max-width: 400px;
    text-align: center;
}
h2 { margin-bottom: 15px; }
.warning { color: red; font-weight: bold; margin-bottom: 20px; }
input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; resize: vertical; }
textarea { min-height: 120px; }
button { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #6a11cb; color: white; font-size: 16px; cursor: pointer; transition: 0.3s; }
button:hover { background: #2575fc; }
.success { color: green; font-weight: bold; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="container">
<h2>Send an Anonymous Message</h2>
<div class="warning">Sa'eed won't know your name!</div>
<form id="messageForm">
    <input type="text" id="name" placeholder="Enter your name to proceed" required>
    <textarea id="message" placeholder="Type your message..." required></textarea>
    <button type="submit">Send</button>
    <div id="status"></div>
</form>
</div>

<script>
const form = document.getElementById('messageForm');
form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const message = document.getElementById('message').value.trim();
    const status = document.getElementById('status');

    if (!name || !message) return;

    const url = "https://script.google.com/macros/s/AKfycbz2LpsxzDvZnwz7RcanzDcYIDSGqx225QcJSuZXuAcigk9mYuyAGyzVcN6LuSUk6PyJ/exec";
    try {
        const res = await fetch(`${url}?name=${encodeURIComponent(name)}&message=${encodeURIComponent(message)}`);
        const text = await res.text();
        status.textContent = text;
        status.className = 'success';
        form.reset();
    } catch(err) {
        status.textContent = "Failed to send message!";
        status.className = 'warning';
    }
});
</script>
</body>
</html>
