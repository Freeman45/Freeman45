<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anonymous Message</title>
</head>
<body>
    <form id="msgForm">
        <input name="name" placeholder="Name" required><br><br>
        <textarea name="message" placeholder="Message" required></textarea><br><br>
        <button type="submit">Send Message</button>
    </form>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbz2LpsxzDvZnwz7RcanzDcYIDSGqx225QcJSuZXuAcigk9mYuyAGyzVcN6LuSUk6PyJ/exec';
        
        document.getElementById('msgForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: e.target.name.value,
                message: e.target.message.value
            };
            
            await fetch(URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            });
            
            alert("Message sent! Check your Google Sheet now.");
            e.target.reset();
        };
    </script>
</body>
</html>
